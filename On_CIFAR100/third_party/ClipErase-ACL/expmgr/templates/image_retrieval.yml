mode: "train"
task: "image_retrieval"

train:
  batch_size: 64
  learning_rate: 0.00000001
  epochs: 10
  weight_decay: 0.0

val:
  batch_size: 64
  checkpoint: ""

test:
  batch_size: 64
  checkpoint: ""

dataset:
  name: "Flickr30k"
  forget_rule: "lambda caption: 'elephant' in caption.lower()"

dataloader:
  shuffle: True 
  num_workers: 4

misc:
  seed: 43 
  device: "cuda:1"

loss:
  weights:
    forget_set_image_loss: 1
    forget_set_text_loss: 1
    retain_set_image_loss: 1
    retain_set_text_loss: 1
    kl_div_image_loss: 1
    kl_div_text_loss: 1

dataset_infos:
  Flickr30k:
    annotations_file: "/home/tianyu/dataset/flickr30k_images/results.csv"      # <-- change to your own path
    img_dir: "/home/tianyu/dataset/flickr30k_images/flickr30k_images"          # <-- change to your own path
  CIFAR100:
    root: "./"
    download: True 
